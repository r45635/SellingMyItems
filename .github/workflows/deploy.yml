name: Deploy to VPS

on:
  push:
    branches: [main]
    # Doc-only changes don't affect the build — skip the deploy for them.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IMAGE: sellingmyitems-app
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # The image is built here, on the runner, never on the VPS (1 vCPU / 1 GB cannot
      # run a Next.js build safely). The build needs no database: the DATABASE_URL
      # build arg only has to be well-formed.
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          build-args: |
            DATABASE_URL=postgresql://build:build@db:5432/build
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up SSH (pinned host key)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          [ -n "$VPS_HOST_KEY" ] || { echo "❌ Secret VPS_HOST_KEY is missing (the server's 'ssh-ed25519 AAAA…' public key)."; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ "$VPS_PORT" = 22 ]; then KH_HOST="$VPS_HOST"; else KH_HOST="[$VPS_HOST]:$VPS_PORT"; fi
          printf '%s %s\n' "$KH_HOST" "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
          EOF
          ssh vps true

      - name: Ship image to the VPS
        run: |
          set -euo pipefail
          ls -lh "$RUNNER_TEMP/image.tar"
          out=$(gzip -1 -c "$RUNNER_TEMP/image.tar" | ssh vps 'gunzip | docker load')
          echo "$out"
          grep -qF "Loaded image: $IMAGE:$TAG" <<<"$out" || { echo "❌ docker load did not report $IMAGE:$TAG"; exit 1; }

      - name: Deploy on the VPS
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: ssh vps 'bash -s' -- "$TAG" "$VPS_APP_DIR" < scripts/deploy-remote.sh
